name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release archives from a fresh immutable checkout
        env:
          VERSION: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="topophany_${VERSION#v}_${os}_${arch}"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            bin=topo; [ "$os" = windows ] && bin=topo.exe
            # The checkout is one commit without tags, so the toolchain can
            # stamp only a pseudo-version; the tag names the release.
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X github.com/WhitenWhiten/topophany/internal/model.Version=${VERSION#v}" -o "$stage/$bin" ./cmd/topo
            if [ "$os/$arch" = linux/amd64 ]; then
              [ "$("$stage/$bin" version)" = "Topophany ${VERSION#v}" ]
            fi
            python3 scripts/release_metadata.py --revision "$SOURCE_SHA" --destination "$stage"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
            fi
          done
          git show "$SOURCE_SHA:CHANGELOG.md" > dist/CHANGELOG.md
          git show "$SOURCE_SHA:docs/releases/$VERSION.md" > dist/RELEASE_NOTES.md
          printf '\nSource commit: %s\n' "$SOURCE_SHA" >> dist/RELEASE_NOTES.md
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
          merge-multiple: true
      - name: Verify and publish inert release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          cd dist
          sha256sum --check --strict SHA256SUMS.txt
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object | [.type, .sha] | @tsv')
          for depth in {1..16}; do
            read -r kind sha <<< "$object"
            [ "$kind" != tag ] && break
            object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object | [.type, .sha] | @tsv')
          done
          read -r kind sha <<< "$object"
          [[ "$kind" == commit && "$sha" == "$SOURCE_SHA" ]] || { echo 'Release tag differs from built source' >&2; exit 1; }
          release_flags=(--verify-tag)
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" ./*.tar.gz ./*.zip ./SHA256SUMS.txt ./CHANGELOG.md ./RELEASE_NOTES.md --title "Topophany $VERSION" --target "$SOURCE_SHA" --notes-file ./RELEASE_NOTES.md "${release_flags[@]}"
