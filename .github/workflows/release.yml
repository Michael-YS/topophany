name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -count=1 ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="topophany_${VERSION#v}_${os}_${arch}"
            stage="$RUNNER_TEMP/$name"
            mkdir -p "$stage"
            bin=topo; [ "$os" = windows ] && bin=topo.exe
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$stage/$bin" ./cmd/topo
            cp LICENSE README.md CHANGELOG.md "$stage/"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
